<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>意见反馈 · CnkeIDE</title>
  <meta name="description" content="CnkeIDE 意见反馈 — 提交建议与问题，第一时间获取官方回复。" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            base: '#0f172a',
            'cyan-accent': '#22d3ee',
            'cyan-bright': '#0ea5e9',
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(34,211,238,.15), 0 0 24px rgba(34,211,238,.12)',
          },
        },
      },
    };
  </script>

  <style>
    html, body { background-color: #0f172a; color: #e2e8f0; -webkit-font-smoothing: antialiased; }
    .bg-grid {
      background-image:
        linear-gradient(rgba(34,211,238,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,.045) 1px, transparent 1px);
      background-size: 56px 56px;
    }
    .glow-orb { position: absolute; border-radius: 9999px; filter: blur(90px); opacity: .45; pointer-events: none; }
    .glass-card {
      background: linear-gradient(155deg, rgba(30,41,59,.62), rgba(15,23,42,.55));
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148,163,184,.12);
    }
    .text-gradient { background: linear-gradient(100deg,#a5f3fc 0%,#22d3ee 45%,#0ea5e9 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .btn-primary { background: linear-gradient(120deg,#0ea5e9,#22d3ee); color: #06121f; transition: all .3s ease; box-shadow: 0 8px 24px rgba(14,165,233,.28); }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 12px 32px rgba(34,211,238,.42); transform: translateY(-2px); filter: brightness(1.05); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .nav-link { position: relative; color: #94a3b8; transition: color .25s; }
    .nav-link:hover { color: #e2e8f0; }
    .nav-link::after { content: ''; position: absolute; left: 0; bottom: -6px; width: 0; height: 2px; background: linear-gradient(90deg,#22d3ee,#0ea5e9); transition: width .3s ease; border-radius: 2px; }
    .nav-link:hover::after { width: 100%; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    .field { background: rgba(15,23,42,.7); border: 1px solid rgba(148,163,184,.2); border-radius: 10px; color: #e2e8f0; outline: none; transition: border-color .25s, box-shadow .25s; width: 100%; }
    .field:focus { border-color: rgba(34,211,238,.55); box-shadow: 0 0 0 3px rgba(34,211,238,.12); }
    .msg-body { white-space: pre-wrap; word-break: break-word; line-height: 1.7; }
    .reply-box { background: rgba(52,211,153,.06); border-left: 3px solid #34d399; border-radius: 8px; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .fb-item { animation: fadeSlideIn .4s cubic-bezier(.4,0,.2,1) both; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(34,211,238,.25); border-top-color: #22d3ee; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px); background: #065f46; color: #fff; padding: 10px 22px; border-radius: 10px; font-size: 13px; opacity: 0; transition: all .3s; z-index: 100; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: #7f1d1d; }
    .new-dot { width: 8px; height: 8px; border-radius: 999px; background: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,.8); }
  </style>
</head>
<body class="min-h-screen">

  <!-- 背景 -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute inset-0 bg-grid"></div>
    <div class="glow-orb w-[520px] h-[520px] bg-cyan-500/25 -top-40 -right-40"></div>
    <div class="glow-orb w-[480px] h-[480px] bg-indigo-600/20 bottom-0 -left-40"></div>
  </div>

  <!-- 导航栏 -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0f172a]/70 border-b border-white/5">
    <nav class="max-w-6xl mx-auto px-5 md:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-sky-600 flex items-center justify-center shadow-glow">
          <svg viewBox="0 0 24 24" class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"></path>
          </svg>
        </div>
        <div class="leading-tight">
          <div class="text-white font-bold text-lg tracking-tight">意见反馈</div>
          <div class="text-[10px] text-cyan-300/70 -mt-1 font-mono">CnkeIDE</div>
        </div>
      </a>
      <div class="flex items-center gap-5 text-sm font-medium">
        <a href="/" class="nav-link">官网首页</a>
        <a href="/#features" class="nav-link hidden md:block">功能特性</a>
        <a href="/#roadmap" class="nav-link hidden md:block">迭代路线</a>
        <a href="/#latest" class="nav-link hidden md:block">最新版本</a>
        <a href="/docs.html" class="nav-link hidden sm:block">文档</a>
        <a href="/announcements/" class="nav-link">公告中心</a>
      </div>
    </nav>
  </header>

  <!-- 主内容 -->
  <main class="max-w-6xl mx-auto px-5 md:px-8 py-10 md:py-14">
    <div class="mb-8">
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">
        意见<span class="text-gradient">反馈</span>
      </h1>
      <p class="mt-2 text-slate-400 text-sm">提交建议与问题，官方回复会实时同步到这里。也可在 CnkeIDE 客户端「公告与反馈」中查看。</p>
    </div>

    <div class="grid lg:grid-cols-5 gap-6 items-start">

      <!-- ===== 左：提交表单 ===== -->
      <section class="lg:col-span-2 glass-card rounded-2xl p-6 lg:sticky lg:top-24">
        <h2 class="text-lg font-bold text-white mb-1">提交反馈</h2>
        <p class="text-xs text-slate-500 mb-5">带 <span class="text-red-400">*</span> 为必填</p>

        <label class="block text-sm text-slate-300 mb-2">反馈内容 <span class="text-red-400">*</span></label>
        <textarea id="msgInput" rows="7" maxlength="5000" class="field px-3 py-2.5 text-sm resize-y"
          placeholder="描述你遇到的问题或建议（5000 字以内）…"></textarea>
        <div class="text-right text-xs text-slate-500 mt-1"><span id="charCount">0</span>/5000</div>

        <label class="block text-sm text-slate-300 mb-2 mt-3">联系方式 <span class="text-slate-500">（选填，便于官方回访）</span></label>
        <input id="contactInput" type="text" maxlength="200" class="field px-3 py-2.5 text-sm" placeholder="邮箱 / QQ / 微信 …">

        <button id="submitBtn" class="btn-primary w-full mt-5 py-2.5 rounded-lg text-sm font-bold">提交反馈</button>

        <div class="mt-6 pt-5 border-t border-white/5">
          <div class="text-xs text-slate-500 mb-1.5">我的反馈编号（报问题时提供给官方可快速定位）</div>
          <div class="flex items-center gap-2">
            <code id="deviceId" class="flex-1 text-xs font-mono text-cyan-300/90 bg-black/30 border border-white/10 rounded-lg px-3 py-2 truncate"></code>
            <button id="copyBtn" class="text-xs text-slate-400 hover:text-cyan-300 border border-white/10 rounded-lg px-3 py-2 transition-colors">复制</button>
          </div>
        </div>
      </section>

      <!-- ===== 右：我的反馈 ===== -->
      <section class="lg:col-span-3">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            我的反馈
            <span id="newBadge" class="hidden items-center gap-1.5 text-xs font-semibold text-amber-300 bg-amber-400/10 border border-amber-400/30 rounded-full px-2.5 py-0.5"><span class="new-dot"></span>有新回复</span>
          </h2>
          <button id="reloadBtn" class="text-xs text-slate-400 hover:text-cyan-300 transition-colors">刷新</button>
        </div>

        <div id="listBox" class="flex flex-col gap-4">
          <div class="glass-card rounded-2xl p-10 flex items-center justify-center">
            <div class="spinner"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="border-t border-white/5 mt-10">
    <div class="max-w-6xl mx-auto px-5 md:px-8 py-6 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500">
      <div>© 2026 CnkeIDE · 本地优先 AI 编程 IDE · <span data-live-version class="font-mono text-slate-400">v1.3.10</span></div>
      <div class="flex items-center gap-4">
        <a href="/docs.html" class="hover:text-cyan-300 transition-colors">文档</a>
        <a href="/#latest" class="hover:text-cyan-300 transition-colors">更新日志</a>
        <a href="/announcements/" class="hover:text-cyan-300 transition-colors">公告中心</a>
        <a href="/feedback/admin.html" class="hover:text-slate-600 transition-colors">管理入口</a>
        <a href="/" class="hover:text-cyan-300 transition-colors">返回官网</a>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

<script>
const API = '/feedback/api.php';
const $ = (id) => document.getElementById(id);
const MAX_LEN = 5000;

/* ---------- 匿名设备 id（与客户端 cnke_ 前缀区分，便于管理员识别网页来源） ---------- */
function getDeviceId() {
  const KEY = 'cnke_web_device';
  let id = localStorage.getItem(KEY) || '';
  if (!id) {
    const rnd = Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b => b.toString(16).padStart(2, '0')).join('');
    id = 'cnke_web_' + rnd;
    localStorage.setItem(KEY, id);
  }
  return id;
}
const DEVICE = getDeviceId();
$('deviceId').textContent = DEVICE;

/* ---------- 新回复检测：记录已读回复的最大时间戳 ---------- */
function getLastSeen() { return Number(localStorage.getItem('cnke_web_seen_' + DEVICE) || 0); }
function setLastSeen(t) { localStorage.setItem('cnke_web_seen_' + DEVICE, String(t)); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ms) {
  const d = new Date(Number(ms));
  const pad = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 提交 ---------- */
$('msgInput').addEventListener('input', () => { $('charCount').textContent = $('msgInput').value.length; });

$('submitBtn').onclick = async () => {
  const msg = $('msgInput').value.trim();
  if (!msg) { toast('请填写反馈内容', true); return; }
  if (msg.length > MAX_LEN) { toast('内容超出 5000 字限制', true); return; }
  const btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中…';
  try {
    const body = new URLSearchParams();
    body.append('action', 'submit');
    body.append('device', DEVICE);
    body.append('msg', msg);
    body.append('contact', $('contactInput').value.trim());
    body.append('version', 'web');
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString(),
    });
    const data = await res.json();
    if (data && data.success) {
      toast('提交成功，感谢反馈');
      $('msgInput').value = '';
      $('charCount').textContent = '0';
      loadHistory(true);
    } else {
      toast((data && data.error) || '提交失败', true);
    }
  } catch (e) {
    toast('网络错误，请稍后重试', true);
  } finally {
    btn.disabled = false;
    btn.textContent = '提交反馈';
  }
};

$('copyBtn').onclick = async () => {
  try {
    await navigator.clipboard.writeText(DEVICE);
    toast('编号已复制');
  } catch (e) {
    const r = document.createRange();
    r.selectNodeContents($('deviceId'));
    const sel = getSelection();
    sel.removeAllRanges(); sel.addRange(r);
    toast('请手动复制选中内容');
  }
};

/* ---------- 历史 ---------- */
let firstLoad = true;

async function loadHistory(force) {
  try {
    const res = await fetch(API + '?action=list&device=' + encodeURIComponent(DEVICE) + '&since=0', { cache: 'no-store' });
    const data = await res.json();
    if (!data || !data.success) throw new Error((data && data.error) || '加载失败');
    renderHistory(data.items || []);
  } catch (e) {
    $('listBox').innerHTML =
      '<div class="glass-card rounded-2xl p-10 flex flex-col items-center gap-3">' +
        '<div class="text-red-300 text-sm">' + esc(e.message || '网络错误') + '</div>' +
        '<button onclick="loadHistory(true)" class="btn-primary px-4 py-2 rounded-lg text-sm font-bold">重试</button>' +
      '</div>';
  }
}

function renderHistory(items) {
  const box = $('listBox');
  if (!items.length) {
    box.innerHTML =
      '<div class="glass-card rounded-2xl p-10 flex flex-col items-center gap-3">' +
        '<svg viewBox="0 0 24 24" class="w-10 h-10 text-slate-600" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>' +
        '<div class="text-slate-400 text-sm">还没有反馈记录</div>' +
        '<div class="text-slate-600 text-xs">在左侧提交第一条反馈吧</div>' +
      '</div>';
    firstLoad = false;
    return;
  }

  // 计算最新回复时间 & 是否有新回复
  let maxReply = 0;
  items.forEach(it => (it.replies || []).forEach(r => { if (r.time > maxReply) maxReply = r.time; }));
  const lastSeen = getLastSeen();
  const hasNew = maxReply > 0 && maxReply > lastSeen && !firstLoad;
  $('newBadge').classList.toggle('hidden', !hasNew);
  $('newBadge').classList.toggle('flex', hasNew);
  if (maxReply > lastSeen) setLastSeen(maxReply);

  box.innerHTML = items.map((it, i) => {
    const replies = it.replies || [];
    const isNewItem = replies.some(r => r.time > lastSeen) && !firstLoad;
    let html = '<div class="fb-item glass-card rounded-2xl p-5" style="animation-delay:' + (i * 50) + 'ms">';
    html += '<div class="flex items-start justify-between gap-3 mb-2.5">';
    html += '<div class="msg-body text-sm text-slate-200 flex-1">' + esc(it.msg) + '</div>';
    if (isNewItem) html += '<span class="new-dot mt-1.5 shrink-0" title="有新回复"></span>';
    html += '</div>';
    html += '<div class="flex items-center gap-3 text-xs text-slate-500 flex-wrap">';
    html += '<span class="font-mono">' + fmtTime(it.time) + '</span>';
    if (it.version && it.version !== 'web') html += '<span>版本 ' + esc(it.version) + '</span>';
    if (!replies.length) html += '<span class="text-slate-600">官方处理中</span>';
    html += '</div>';
    replies.forEach(r => {
      html += '<div class="reply-box mt-3 px-4 py-3">';
      html += '<div class="text-xs font-semibold text-emerald-300 mb-1">官方回复</div>';
      html += '<div class="msg-body text-sm text-slate-200">' + esc(r.content) + '</div>';
      html += '<div class="text-xs text-slate-500 mt-1.5 font-mono">' + fmtTime(r.time) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }).join('');
  firstLoad = false;
}

$('reloadBtn').onclick = () => { firstLoad = true; loadHistory(true); };

/* 初始加载 + 60s 轮询；回到前台立即刷新 */
loadHistory(true);
setInterval(() => { if (!document.hidden) loadHistory(false); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadHistory(false); });
</script>
<script>
/* 版本号动态回填（失败保留静态兜底） */
(function () {
  var els = document.querySelectorAll('[data-live-version]');
  if (!els.length) return;
  fetch('/cnkeide/updates/latest.yml', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
    .then(function (t) {
      var m = /^\s*version:\s*(.+)$/m.exec(t);
      if (!m) return;
      var v = m[1].trim().replace(/^["']|["']$/g, '');
      els.forEach(function (el) { el.textContent = 'v' + v.replace(/^v/, ''); });
    })
    .catch(function () {});
})();
</script>
</body>
</html>
